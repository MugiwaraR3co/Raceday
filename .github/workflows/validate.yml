name: Validate RaceDay Part 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.drawio
          test -f docs/RaceDay_Database.sql
          test -f docs/RaceDay_API_Endpoint_Plan.md

      - name: Display project structure
        run: |
          echo "RaceDay Part 1 files:"
          find . -maxdepth 3 -type f | sort

      - name: Validation successful
        run: echo "RaceDay Part 1 validation passed successfully."